name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Validate, Test, Lint & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate Gradle Configuration
        run: gradle projects --no-daemon --console=plain

      - name: Run Unit & Robolectric Tests Across All Modules
        run: >
          gradle
          :core-binary:testDebugUnitTest
          :asset-model:testDebugUnitTest
          :unity-format:testDebugUnitTest
          :asset-plugins:testDebugUnitTest
          :asset-export:testDebugUnitTest
          :bundle-writer:testDebugUnitTest
          :app:testDebugUnitTest
          --no-daemon --console=plain

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon --console=plain

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            if [ -f "./debug.keystore.base64" ]; then
              base64 --decode ./debug.keystore.base64 > ./debug.keystore
            else
              keytool -genkey -v \
                -keystore ./debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --console=plain
          else
            echo "No release keystore secret configured; building unsigned release APK check."
            gradle :app:assembleRelease -x signReleaseBundle -x packageRelease || gradle :app:compileReleaseSources --no-daemon --console=plain
          fi

      - name: Prepare Versioned APK Artifacts & Build Metadata
        run: |
          mkdir -p build-artifacts
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build-artifacts/AssetDesk-Mobile-debug.apk
          fi
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-artifacts/AssetDesk-Mobile-release.apk
          fi
          {
            echo "app=AssetDesk Mobile"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > build-artifacts/build-metadata.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assetdesk-mobile-apks-${{ github.sha }}
          path: build-artifacts/

      - name: Create GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          generate_release_notes: true
